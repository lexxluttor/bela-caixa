<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bela Caixa — Verificação IndexedDB</title><style>body{font:16px system-ui;margin:30px auto;max-width:720px;padding:0 18px;line-height:1.5}button{padding:12px 20px;background:#650817;color:white;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#f4f4f4;padding:15px;border-radius:8px}small{color:#555}</style></head><body><h1>Verificação do IndexedDB</h1><p>Esta página não ativa o IndexedDB no caixa e não envia dados ao Google Sheets.</p><p><button id="ver">Verificar armazenamento</button> <button id="copiar" disabled>Preparar cópia de segurança no IndexedDB</button></p><pre id="saida">Aguardando verificação.</pre><small>Não apague dados do navegador. A preparação não substitui coleções já existentes.</small><script src="js/indexeddb-storage.js"></script><script src="js/indexeddb-bridge.js"></script><script>const out=document.getElementById('saida'),copy=document.getElementById('copiar');let ok=false;function log(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}document.getElementById('ver').onclick=async()=>{try{copy.disabled=true;const names=window.BelaIDBBridge.collections;const local=names.map(n=>{const raw=localStorage.getItem('bm_'+n);if(raw===null)return {nome:n,registros:null};const data=JSON.parse(raw);if(!Array.isArray(data))throw Error('Dados invalidos: '+n);return {nome:n,registros:data.length}});const keys=await BelaIndexedDB.keys();ok=local.filter(x=>['clientes','produtos','vendas'].includes(x.nome)).every(x=>x.registros>0)&&!keys.some(x=>String(x).startsWith('bm_'));copy.disabled=!ok;log({modo:'Somente verificacao',local,colecoesIndexedDB:keys,preparacaoPermitida:ok});}catch(e){log('ERRO: '+e.message)}};copy.onclick=async()=>{if(!ok)return;if(!confirm('Preparar copia dos dados locais no IndexedDB? O modo atual do caixa nao sera alterado.'))return;copy.disabled=true;try{log({resultado:'Preparando e verificando...'});const result=await BelaIDBBridge.prepararDoLocal();log({resultado:'Copia verificada',colecoes:result,modoCaixa:'Nao alterado'});}catch(e){log('ERRO: '+e.message)}};</script></body></html>
